[package]
name = "PracticeTodoRust"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["cors", "fs"] }
base64 = "0.22"
dotenvy = "0.15"
hmac = "0.12.1"
sha2 = "0.10.9"